# Isolated recovery-test source, never the canonical or legacy runtime.
x-labels: &labels
  fleet.recovery-source: ${RECOVERY_ID:?Generated by verify_recovery.py}
services:
  postgres:
    image: postgis/postgis:16-3.5
    labels: *labels
    environment:
      POSTGRES_USER: fleet_recovery
      POSTGRES_DB: ${RECOVERY_DATABASE:?}
      POSTGRES_PASSWORD: ${RECOVERY_PASSWORD:?}
    ports: ["127.0.0.1:0:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 40
  minio:
    build: {context: .., dockerfile: infra/docker/minio.Dockerfile}
    image: fleet-m8-recovery-minio
    labels: *labels
    command: server /data
    environment:
      MINIO_ROOT_USER: fleet_recovery
      MINIO_ROOT_PASSWORD: ${RECOVERY_PASSWORD:?}
    ports: ["127.0.0.1:0:9000"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 40
  traccar:
    image: traccar/traccar:6.10-ubuntu
    labels: *labels
    ports: ["127.0.0.1:0:8082", "127.0.0.1:0:5055"]
    volumes:
      - traccar-data:/opt/traccar/data
      - traccar-logs:/opt/traccar/logs
      - ./docker/traccar.xml:/opt/traccar/conf/traccar.xml:ro
    healthcheck:
      test: ["CMD", "bash", "-ec", "echo > /dev/tcp/127.0.0.1/8082"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 30s
  api:
    build: {context: .., dockerfile: infra/docker/api.Dockerfile}
    image: fleet-m8-recovery-api
    labels: *labels
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://fleet_recovery:${RECOVERY_PASSWORD}@postgres:5432/${RECOVERY_DATABASE}
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: recovery-pod
      S3_ACCESS_KEY: fleet_recovery
      S3_SECRET_KEY: ${RECOVERY_PASSWORD}
      JWT_SECRET: ${RECOVERY_JWT_SECRET:?}
      TRACCAR_URL: http://traccar:8082
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
      traccar: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=5)"]
      interval: 3s
      timeout: 10s
      retries: 40
      start_period: 30s
volumes:
  postgres-data: {labels: *labels}
  minio-data: {labels: *labels}
  traccar-data: {labels: *labels}
  traccar-logs: {labels: *labels}
