name: M5 photo POD
on: [push, pull_request]
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --global npm@12.2.0
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
        env: {NEXT_TELEMETRY_DISABLED: '1'}
      - run: node scripts/verify_web_surface.mjs
      - run: npm run build:mobile
      - run: node scripts/verify_mobile_surface.mjs
      - name: M5 security audit (no risk acceptance inherited from M4)
        run: npm audit
  backend:
    runs-on: ubuntu-latest
    services:
      traccar:
        image: traccar/traccar:6.10-ubuntu
        ports: ['8082:8082', '5055:5055']
        options: >-
          --health-cmd "bash -c 'echo > /dev/tcp/127.0.0.1/8082'"
          --health-interval 5s --health-timeout 3s --health-retries 30
          --health-start-period 60s
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: fleet_test
          POSTGRES_PASSWORD: isolated_ci_test
          POSTGRES_DB: fleet_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fleet_test -d fleet_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://fleet_test:isolated_ci_test@localhost:5432/fleet_test
      TEST_DATABASE_URL: postgresql+psycopg://fleet_test:isolated_ci_test@localhost:5432/fleet_test
      APP_ENV: test
      TRACCAR_URL: http://127.0.0.1:8082
      TRACCAR_FEED_URL: http://127.0.0.1:5055
      TRACCAR_EMAIL: m1-ci@fleet.local
      TRACCAR_PASSWORD: isolated-ci-only-traccar-password
      JWT_SECRET: isolated-ci-only-jwt-key-over-32-characters
      OSRM_URL: http://127.0.0.1:5000
      OSRM_METADATA_PATH: ${{ github.workspace }}/artifacts/osrm/metadata.json
      S3_ENDPOINT_URL: http://127.0.0.1:9000
      S3_ACCESS_KEY: isolated_ci_storage
      S3_SECRET_KEY: isolated-ci-only-storage-password
      S3_BUCKET: fleet-pod-test-ci
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.12.23'}
      - run: uv sync --frozen --python 3.12
      - run: uv run --frozen ruff check . ../../scripts
      - run: uv run --frozen ruff format --check . ../../scripts
      - run: uv run --frozen mypy app
      - name: Build and start real private MinIO for M5 integration
        run: |
          docker build -f ../../infra/docker/minio.Dockerfile -t fleet-m5-ci-minio ../..
          docker run -d --name m5-minio -p 127.0.0.1:9000:9000 -e MINIO_ROOT_USER="$S3_ACCESS_KEY" -e MINIO_ROOT_PASSWORD="$S3_SECRET_KEY" fleet-m5-ci-minio server /data
          uv run --project . --frozen ../../scripts/bootstrap_pod_test.py
      - name: Prepare and start real self-hosted OSRM
        run: |
          uv run --project . --frozen ../../scripts/prepare_osrm.py --pbf infra/osrm/fixtures/Saigon.osm.pbf --sha256 305729efc04180b6a151ba3d61f6bb5c91b05ed044eed734b30f3625f806119b
          docker run -d --name m3-osrm -p 127.0.0.1:5000:5000 -v "$GITHUB_WORKSPACE/artifacts/osrm:/data:ro" ghcr.io/project-osrm/osrm-backend:v6.0.0 osrm-routed --algorithm mld /data/map.osrm
          uv run --project . --frozen ../../scripts/verify_osrm.py
      - run: uv run --frozen alembic upgrade head
      - run: uv run --project . --frozen ../../scripts/bootstrap_traccar_test.py
      - run: uv run --frozen pytest
      - run: uv run --frozen alembic downgrade base
      - run: uv run --frozen alembic upgrade head
      - run: uv run --frozen pytest -m integration
